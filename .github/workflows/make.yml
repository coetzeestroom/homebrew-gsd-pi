# Verifies the Makefile's own targets still work. `make test` depends on
# `brew-verify`, which runs every target in this repo's Makefile in order:
# brew-cleanup-before, brew-setup, brew-tap-syntax and brew-formulae.
name: make test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Makefile
      - .github/workflows/make.yml
  pull_request:
    paths:
      - Makefile
      - .github/workflows/make.yml

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      # On macOS `setup-homebrew` moves the tap into the workspace, but inside a
      # container it stays in `Library/Taps`, so resolve the tap path explicitly
      # rather than assuming the Makefile is in the default working directory.
      - name: Run make test
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          cd "$(brew --repository "$TAP_NAME")"
          make test
